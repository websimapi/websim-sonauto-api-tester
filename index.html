<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonauto API Tester</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎵</text></svg>">
</head>
<body>
    <div class="container">
        <h1>Sonauto API Tester</h1>

        <div class="auth-section">
            <label for="apiKey">API Key:</label>
            <input type="password" id="apiKey" placeholder="Enter your Sonauto API key">
            <button id="saveApiKey">Save Key</button>
            <p class="key-status" id="keyStatus">No API key saved.</p>
        </div>

        <div class="api-actions">
            <h2>Generate Song</h2>
            <form id="generateForm">
                <label for="prompt">Prompt:</label>
                <textarea id="prompt" rows="3" placeholder="e.g., An upbeat rock song with heavy guitar riffs"></textarea>

                <label for="tags">Tags (comma-separated):</label>
                <input type="text" id="tags" placeholder="e.g., rock, energetic">

                <label for="lyrics">Lyrics:</label>
                <textarea id="lyrics" rows="4" placeholder="Enter lyrics here (optional)"></textarea>

                 <div class="checkbox-container">
                    <input type="checkbox" id="instrumental">
                    <label for="instrumental">Instrumental</label>
                 </div>

                <label for="seed">Seed (optional):</label>
                <input type="number" id="seed" placeholder="e.g., 12345">

                 <label for="outputFormat">Output Format:</label>
                 <select id="outputFormat">
                    <option value="ogg">ogg (default)</option>
                    <option value="mp3">mp3</option>
                    <option value="flac">flac</option>
                    <option value="wav">wav</option>
                    <option value="m4a">m4a</option>
                 </select>

                 <label for="outputBitRate">Output Bit Rate (kbps, optional for mp3/m4a):</label>
                 <select id="outputBitRate">
                    <option value="">Default</option>
                    <option value="128">128</option>
                    <option value="192">192</option>
                    <option value="256">256</option>
                    <option value="320">320</option>
                 </select>

                <button type="submit" id="generateButton">Generate Song</button>
            </form>
        </div>

        <div class="status-section">
            <h2>Generation Status</h2>
            <div id="statusMessages">
                <p>Submit a generation request to see status updates.</p>
            </div>
        </div>

        <div class="results-section">
            <h2>Generated Songs</h2>
            <div id="resultsContainer">
                <p>Generated songs will appear here.</p>
            </div>
        </div>

    </div>

    <script type="importmap">
      {
        "imports": {
          "config": "./config.js"
        }
      }
    </script>
    <script type="module" src="script.js"></script>

</body>
</html>
